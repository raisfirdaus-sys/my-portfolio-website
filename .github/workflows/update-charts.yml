name: Update price chart history

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 (see update-quotes.yml) and
    # staggered from the other two 30-min jobs so they don't queue together.
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch chart history
        run: node scripts/fetch-charts.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/charts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update price chart history"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No chart changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh chart data. Dispatching it
      # explicitly is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
