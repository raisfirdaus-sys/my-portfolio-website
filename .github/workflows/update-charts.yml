name: Update price chart history

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 (see update-quotes.yml) and
    # staggered from the other two 30-min jobs so they don't queue together.
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch chart history
        run: node scripts/fetch-charts.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/charts.json
          if git diff --cached --quiet; then
            echo "No chart changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update price chart history"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # This job's push can race update-quotes.yml/update-news.yml,
          # which run on their own schedules against the same branch — if
          # one of them lands first, a plain push is rejected as
          # non-fast-forward. Rebase onto the latest and retry rather than
          # failing outright; safe here since each workflow only ever
          # touches its own data/*.json file, so there's nothing to
          # conflict with.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying..."
            git fetch origin claude/stock-portfolio-website-2ulin2
            git rebase origin/claude/stock-portfolio-website-2ulin2
          done
          echo "Push still failing after 5 attempts."
          exit 1

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh chart data. Dispatching it
      # explicitly is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
