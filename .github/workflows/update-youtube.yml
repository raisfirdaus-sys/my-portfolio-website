name: Update YouTube playlist videos

on:
  schedule:
    # Every 30 minutes, offset from the other data-fetch workflows so they
    # don't queue behind each other (see update-quotes.yml).
    - cron: "26,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube playlist
        run: node scripts/fetch-youtube.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then
            echo "No YouTube changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update YouTube playlist videos"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Same race-safe retry as the other data-fetch workflows — each
          # one only ever touches its own data/*.json file.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying..."
            git fetch origin claude/stock-portfolio-website-2ulin2
            git rebase origin/claude/stock-portfolio-website-2ulin2
          done
          echo "Push still failing after 5 attempts."
          exit 1

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh videos. Dispatching it explicitly
      # is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
