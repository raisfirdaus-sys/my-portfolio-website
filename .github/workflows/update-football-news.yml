name: Update football news

on:
  schedule:
    # Measured over 658 runs on the old 30-minute schedule: GitHub actually
    # ran it every 234 minutes on average, worst case 355, because it drops
    # scheduled events when the shared pool is busy - about 86% of them here.
    # The script never failed; the runs simply never started.
    #
    # Asking six times an hour instead of twice does not make GitHub any more
    # punctual, but far more attempts survive, so the gap between real runs
    # comes down. Offset off the :00 and :30 rush, and staggered from
    # update-news.yml (:12/:42) so they never queue behind each other.
    - cron: "03,13,23,33,43,53 * * * *"

  # The only way to get an exact 30 minutes: something outside GitHub pokes
  # this workflow on a real clock. A free pinger (cron-job.org, UptimeRobot)
  # POSTs to the repository_dispatch API on the half hour, which starts this
  # run immediately instead of queueing it behind GitHub's own scheduler.
  # It needs a fine-grained token with Contents: read and write, stored as a
  # repository secret - see docs/news-refresh.md.
  repository_dispatch:
    types: [refresh-news]

  workflow_dispatch:

# One refresh at a time. Six attempts an hour will sometimes overlap a run
# that is still going; the newer one waits rather than pushing against it.
concurrency:
  group: update-football-news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-football-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch football news
        run: node scripts/fetch-football-news.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/football-news.json
          if git diff --cached --quiet; then
            echo "No news changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Update football news"
          # Several scheduled workflows write to this same branch. Whichever
          # lands first makes the others non-fast-forward; rebase and retry
          # rather than failing, which is safe because each workflow only
          # ever touches its own data/*.json file.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying..."
            git fetch origin claude/stock-portfolio-website-2ulin2
            git rebase origin/claude/stock-portfolio-website-2ulin2
          done
          echo "Push still failing after 5 attempts."
          exit 1

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows, so pages.yml would not redeploy with the fresh news.
      # Dispatching it explicitly is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
