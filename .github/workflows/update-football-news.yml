name: Update football news

on:
  schedule:
    # Twice an hour, matching the three schedules on this repository that are
    # known to work. Measured 21-23 Sept, every one of them lands about the
    # same way:
    #
    #   update-news.yml    cron 12,42  ->  a real run every 4.3h, worst 5.9h
    #   update-quotes.yml  cron 6,36   ->  a real run every 4.3h, worst 7.4h
    #
    # GitHub drops most scheduled events on a shared runner pool, and the
    # rate it does start them looks the same whichever schedule is asked for:
    # this file briefly asked six times an hour and got no scheduled run at
    # all. So it asks the way the working ones ask. Expect a refresh roughly
    # every four to five hours, not every thirty minutes - the panel prints
    # the truth as "updated N ago", taken from the file itself.
    #
    # Offset off the :00/:30 rush and clear of :06/:36, :12/:42, :20/:50 and
    # :26/:56, so the five schedules here never queue behind each other.
    - cron: "03,33 * * * *"

    # Measured after the fact: this schedule has never started a single
    # run. Not on 03,13,23,33,43,53, not on 03,33 - zero, while four other
    # schedules on this same repository were firing every four hours or so
    # the whole time. It is kept because it costs nothing and may yet
    # start, but it is NOT what refreshes this feed. Those four workflows
    # each dispatch this one when they finish, which is what actually
    # brings the news in - see the last step of update-news.yml.

  # Kept for the day an exact clock matters: an outside pinger can POST to
  # the repository_dispatch API and start a run immediately rather than wait
  # on GitHub's scheduler. It needs a token, which is why it is not in use -
  # see docs/news-refresh.md if that trade ever looks worth making.
  repository_dispatch:
    types: [refresh-news]

  workflow_dispatch:

# One refresh at a time: a scheduled run can land while a dispatched one is
# still going, and the newer one waits rather than pushing against it.
concurrency:
  group: update-football-news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-football-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch football news
        run: node scripts/fetch-football-news.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/football-news.json
          if git diff --cached --quiet; then
            echo "No news changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Update football news"
          # Several scheduled workflows write to this same branch. Whichever
          # lands first makes the others non-fast-forward; rebase and retry
          # rather than failing, which is safe because each workflow only
          # ever touches its own data/*.json file.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying..."
            git fetch origin claude/stock-portfolio-website-2ulin2
            git rebase origin/claude/stock-portfolio-website-2ulin2
          done
          echo "Push still failing after 5 attempts."
          exit 1

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows, so pages.yml would not redeploy with the fresh news.
      # Dispatching it explicitly is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
