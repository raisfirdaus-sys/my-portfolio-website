name: Update live stock quotes

on:
  schedule:
    # Every 30 minutes, 24/7, offset to :06/:36 rather than :00/:30.
    # GitHub explicitly warns that schedules pinned to the top/bottom of
    # the hour are more likely to be delayed, since that's when the
    # largest number of cron-scheduled workflows across all of GitHub fire
    # at once — offsetting a few minutes avoids that queueing delay.
    # (Also previously restricted to 8:00-23:30 UTC, which left a dead
    # zone from 00:00-08:00 UTC / 8pm-4am ET where quotes.json never
    # refreshed at all — now runs around the clock.)
    - cron: "6,36 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch quotes
        run: node scripts/fetch-quotes.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update live stock quotes"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # This job's push can race update-news.yml/update-charts.yml,
          # which run on their own schedules against the same branch — if
          # one of them lands first, a plain push is rejected as
          # non-fast-forward. Rebase onto the latest and retry rather than
          # failing outright; safe here since each workflow only ever
          # touches its own data/*.json file, so there's nothing to
          # conflict with.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying..."
            git fetch origin claude/stock-portfolio-website-2ulin2
            git rebase origin/claude/stock-portfolio-website-2ulin2
          done
          echo "Push still failing after 5 attempts."
          exit 1

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh quotes. Dispatching it explicitly
      # is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
