name: Update live stock quotes

on:
  schedule:
    # Every 30 minutes, 24/7, offset to :06/:36 rather than :00/:30.
    # GitHub explicitly warns that schedules pinned to the top/bottom of
    # the hour are more likely to be delayed, since that's when the
    # largest number of cron-scheduled workflows across all of GitHub fire
    # at once — offsetting a few minutes avoids that queueing delay.
    # (Also previously restricted to 8:00-23:30 UTC, which left a dead
    # zone from 00:00-08:00 UTC / 8pm-4am ET where quotes.json never
    # refreshed at all — now runs around the clock.)
    - cron: "6,36 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch quotes
        run: node scripts/fetch-quotes.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live stock quotes"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No quote changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh quotes. Dispatching it explicitly
      # is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
