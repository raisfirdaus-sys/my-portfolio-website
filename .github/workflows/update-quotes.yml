name: Update live stock quotes

on:
  schedule:
    # Every 30 minutes, 24/7. Originally restricted to 8:00-23:30 UTC
    # (pre-market through after-hours on weekdays), but that left a dead
    # zone from 00:00-08:00 UTC (8pm-4am ET) where quotes.json simply never
    # refreshed — some brokers (incl. the ones several visitors use for US
    # stocks) route overnight trades through 24-hour ATS venues, so a real
    # price move can happen in that window and this needs to catch it
    # rather than show a stale number until the next official session.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stock-portfolio-website-2ulin2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch quotes
        run: node scripts/fetch-quotes.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live stock quotes"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No quote changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages.yml wouldn't
      # otherwise redeploy with the fresh quotes. Dispatching it explicitly
      # is exempt from that restriction.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/stock-portfolio-website-2ulin2
